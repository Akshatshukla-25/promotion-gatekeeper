name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require git >= 2.38 (merge-tree --write-tree)
        run: |
          git --version
          v=$(git --version | awk '{print $3}')
          [ "$(printf '%s\n2.38.0\n' "$v" | sort -V | head -n1)" = "2.38.0" ] || { echo "git >= 2.38 required"; exit 1; }
      - name: Git identity for the seeded test repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Tests with coverage
        run: node --test --experimental-test-coverage "test/*.test.js" | tee coverage.txt
      - name: Demo self-check
        run: node scripts/demo.js
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-and-examples
          path: |
            coverage.txt
            examples/
